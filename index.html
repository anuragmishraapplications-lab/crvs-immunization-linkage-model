cond five years) in 2014 dollars, and the US$0.90 per person development benchmark used to imply the covered population.`,url:`https://documents.worldbank.org/curated/en/457271468148160636`,caveat:`A 2014 global scaling plan, not a contemporary country cost estimate. It is used here as a working benchmark denominator and should be replaced with country-specific capital and operating costs where those become available.`},{id:`S02`,branch:`model`,organization:`U.S. Bureau of Labor Statistics`,title:`Consumer Price Index for All Urban Consumers (CPI-U), annual average`,year:`2014, 2018, 2021`,supports:`Index values 236.736 (2014), 251.107 (2018) and 270.970 (2021) used to restate costs and benefits in 2021 US dollars.`,url:`https://www.bls.gov/cpi/`},{id:`S03`,branch:`immunization`,organization:`Departamento Administrativo Nacional de Estadistica (DANE), Colombia`,title:`Estadisticas Vitales: nacimientos 2024, and national population projections`,year:2024,supports:`Colombia live births of 445,011 and a national population of 53,425,635.`,url:`https://www.dane.gov.co/index.php/estadisticas-por-tema/salud/nacimientos-y-defunciones`},{id:`S04`,branch:`immunization`,organization:`WHO and UNICEF`,title:`WUENIC estimates of national immunization coverage (DTP3)`,year:2024,supports:`DTP3 coverage of 89% (Colombia), 91% (Brazil) and 99% (Costa Rica).`,url:`https://www.who.int/teams/immunization-vaccines-and-biologicals/immunization-analysis-and-insights/global-monitoring/immunization-coverage/who-unicef-estimates-of-national-immunization-coverage`},{id:`S05`,branch:`immunization`,organization:`UNICEF`,title:`Birth registration data warehouse, country profiles`,year:2024,supports:`Working birth-registration coverage inputs of 97% (Colombia) and 96% (Costa Rica).`,url:`https://data.unicef.org/topic/child-protection/birth-registration/`},{id:`S06`,branch:`immunization`,organization:`Instituto Brasileiro de Geografia e Estatistica (IBGE), Registro Civil`,title:`Estatisticas do Registro Civil, and birth registration completeness estimates`,year:2023,supports:`2,376,901 registered live births in Brazil and registration completeness of 99.05%, from which the total birth cohort is derived.`,url:`https://www.ibge.gov.br/estatisticas/sociais/populacao/9110-estatisticas-do-registro-civil.html`},{id:`S07`,branch:`immunization`,organization:`Instituto Nacional de Estadistica y Censos (INEC), Costa Rica`,title:`Estadisticas Vitales: nacimientos, and population estimates`,year:2023,supports:`45,821 registered live births in Costa Rica and a national population of 5,044,197.`,url:`https://inec.cr/estadisticas-fuentes/estadisticas-demograficas`},{id:`S08`,branch:`immunization`,organization:`Health Affairs (Sim, Watts, Constenla, Brenzel and Patenaude)`,title:`Return On Investment From Immunization Against 10 Pathogens In 94 Low- And Middle-Income Countries, 2011-30`,year:2020,supports:`A cost-of-illness return on immunization investment of 19.8 to 1 for the 2021-30 decade. The paper also reports a value-of-statistical-life return of 52.2; the conservative cost-of-illness figure is used here.`,url:`https://www.healthaffairs.org/doi/10.1377/hlthaff.2020.00103`,caveat:`Reported for 94 low- and middle-income countries as a group. It is not a country-specific return and is applied here as a transferred parameter.`},{id:`S09`,branch:`immunization`,organization:`World Health Organization / Immunization Agenda 2030 costing literature`,title:`Average immunization programme cost per surviving infant`,year:2018,supports:`An average immunization programme cost of US$35.8 per surviving infant in 2018 dollars.`,url:`https://www.who.int/teams/immunization-vaccines-and-biologicals/strategies/ia2030`},{id:`S10`,branch:`immunization`,organization:`Government of Bangladesh (Office of the Registrar General, BRIS) and Directorate General of Health Services`,title:`Integration of the Birth Registration Information System with the national immunization (EPI) database`,year:2023,supports:`That an operational birth-registration to immunization database integration exists and functions at national scale.`,url:`https://everychildalive.org/`,caveat:`The published integration operates substantially in the direction immunization to birth registration, using vaccination contacts to prompt registration. It does not establish that birth registration caused higher immunization coverage.`},{id:`S11`,branch:`death-pension`,organization:`Government of Karnataka, Revenue Department (e-JanMa) and Directorate of Social Security and Pensions`,title:`Linkage of the e-JanMa death registration system with social security pension administration`,year:2024,supports:`132,000 deceased beneficiaries removed or suspended from the pension rolls and a reported annual saving of Rs 158.40 crore (Rs 1.584 billion).`,url:`https://ejanma.karnataka.gov.in/`,caveat:`Government-reported programme result for one Indian state. Reported as a saving realised by the pension administration, not as an independently audited figure.`},{id:`S12`,branch:`death-pension`,organization:`Tribunal de Contas da Uniao (TCU), Brazil`,title:`Audit of the Sistema Nacional de Informacoes de Registro Civil (Sirc) and benefit payments to deceased persons`,year:2025,supports:`13.1 million death records absent from Sirc, R$4.4bn of improper payments identified overall, up to R$2.7bn tied specifically to missing death information, and a continuing flow of approximately R$28.5m per month across the public systems examined.`,url:`https://portal.tcu.gov.br/`,caveat:`The R$4.4bn and R$2.7bn figures are accumulated stock, not an annual flow. Only the current monthly flow is annualised in this model.`},{id:`S13`,branch:`death-pension`,organization:`Tribunal de Contas da Uniao (TCU), Brazil`,title:`Sirc audit: current monthly post-death payment flow, social security and social transfer programmes`,year:2025,supports:`R$21,253,072.12 per month of continuing post-death payments in the pension and social-security programmes used for the working calibration.`,url:`https://portal.tcu.gov.br/`,caveat:`The more conservative of the audit's flow figures. It excludes other public systems examined in the same audit.`},{id:`S14`,branch:`death-pension`,organization:`Instituto Brasileiro de Geografia e Estatistica (IBGE)`,title:`Censo Demografico 2022 and subsequent population estimates`,year:2024,supports:`A Brazilian population of 212,812,405 used as the per-capita denominator.`,url:`https://www.ibge.gov.br/estatisticas/sociais/populacao.html`},{id:`S15`,branch:`death-pension`,organization:`Banco Central do Brasil`,title:`Annual average BRL/USD exchange rate`,year:2024,supports:`An exchange rate of 5.39 Brazilian reais per US dollar.`,url:`https://www.bcb.gov.br/en/statistics/exchangerates`},{id:`S16`,branch:`death-pension`,organization:`Auditor-General of South Africa and South African Social Security Agency (SASSA)`,title:`Audit of social grant payments and life-status verification against the Department of Home Affairs`,year:2024,supports:`Approximately R15 million paid to deceased beneficiaries, and 5,924 beneficiaries paid more than 45 days after death.`,url:`https://www.agsa.co.za/`,caveat:`Residual leakage in a system that already performs routine matching against the population register. Used for triangulation, not included in the headline calculation.`},{id:`S17`,branch:`census`,organization:`United Nations Economic Commission for Europe (UNECE)`,title:`Guidelines on the use of registers and administrative data for population and housing censuses, and the 2020 census round cost review`,year:2020,supports:`A median field-enumeration census cost of US$6.08 per person and a median register-based census cost of US$0.18 per person, a gross difference of US$5.90 per person per census round.`,url:`https://unece.org/statistics/publications/guidelines-use-registers-and-administrative-data-population-and-housing`,caveat:`A cross-country median across systems of differing maturity. hild is on the civil register. That combination is what makes a linkage useful: the children who are missing doses are, on the arithmetic, overwhelmingly already known to the state. Colombia is the median of the three direct-link core cases and therefore sets the calibration used on the value map.`,metrics:{birthCohort:{value:445011,unit:`live births`,year:2024,evidenceClass:`A`,sourceIds:[`S03`],observed:!0,label:`Annual birth cohort`},population:{value:53425635,unit:`people`,year:2024,evidenceClass:`A`,sourceIds:[`S03`],observed:!0,label:`Population`},birthRegistration:{value:.97,unit:`share of births`,year:2024,evidenceClass:`B`,sourceIds:[`S05`],observed:!1,label:`Birth registration`},dtp3:{value:.89,unit:`share of surviving infants`,year:2024,evidenceClass:`B`,sourceIds:[`S04`],observed:!1,label:`DTP3 coverage`}}},{id:`brazil`,country:`Brazil`,branch:`immunization`,role:`core`,grade:`Direct-link core case`,readiness:`modeled`,isCalibrationCase:!0,narrative:`Brazil combines the largest birth cohort of the three core cases with registration completeness above 99%. The total cohort is derived by grossing up 2,376,901 registered births by the 99.05% completeness estimate. Because the cohort is large, the absolute opportunity is the biggest of the three even though the findable share is the smallest, which is a useful reminder that share and scale are different arguments.`,metrics:{registeredBirths:{value:2376901,unit:`registered live births`,year:2023,evidenceClass:`A`,sourceIds:[`S06`],observed:!0,label:`Registered live births`},birthCohort:{value:null,unit:`live births`,year:2023,evidenceClass:`C`,sourceIds:[`S06`],observed:!1,label:`Annual birth cohort`,derivation:`2,376,901 registered births / 0.9905 registration completeness = approximately 2,399,698 total births.`,caveat:`Derived, not directly enumerated. Computed at runtime from registered births and completeness.`},population:{value:212812405,unit:`people`,year:2024,evidenceClass:`A`,sourceIds:[`S14`],observed:!0,label:`Population`},birthRegistration:{value:.9905,unit:`share of births`,year:2023,evidenceClass:`B`,sourceIds:[`S06`],observed:!1,label:`Birth registration completeness`},dtp3:{value:.91,unit:`share of surviving infants`,year:2024,evidenceClass:`B`,sourceIds:[`S04`],observed:!1,label:`DTP3 coverage`}}},{id:`costa-rica`,country:`Costa Rica`,branch:`immunization`,role:`core`,grade:`Direct-link core case, limit case`,readiness:`modeled`,isCalibrationCase:!0,narrative:`Costa Rica registers almost every birth and vaccinates almost every child. DTP3 coverage of 99% leaves a findable share of under one percent, so the monetary opportunity from a registration-to-immunization linkage is correctly very small. This is analytically useful rather than disappointing: interoperability can be excellent while the marginal vaccination opportunity it unlocks is close to exhausted. A country can be a linkage success story and still have little left to monetize on this particular pathway.`,metrics:{registeredBirths:{value:45821,unit:`registered live births`,year:2023,evidenceClass:`A`,sourceIds:[`S07`],observed:!0,label:`Registered live births`},birthCohort:{value:null,unit:`live births`,year:2023,evidenceClass:`C`,sourceIds:[`S07`],observed:!1,label:`Annual birth cohort`,derivation:`45,821 registered births / 0.96 registration coverage = approximately 47,730 total births.`,caveat:`Derived, not directly enumerated. Computed at runtime.`},population:{value:5044197,unit:`people`,year:2023,evidenceClass:`A`,sourceIds:[`S07`],observed:!0,label:`Population`},birthRegistration:{value:.96,unit:`share of births`,year:2023,evidenceClass:`B`,sourceIds:[`S05`],observed:!1,label:`Birth registration`},dtp3:{value:.99,unit:`share of surviving infants`,year:2024,evidenceClass:`B`,sourceIds:[`S04`],observed:!1,label:`DTP3 coverage`}}},{id:`bangladesh`,country:`Bangladesh`,branch:`immunization`,role:`supporting`,grade:`Integration case, not used in calibration`,readiness:`supporting`,isCalibrationCase:!1,narrative:`Bangladesh operates a real, national-scale integration between the Birth Registration Information System and the immunization (EPI) database. It is the clearest demonstration anywhere that the two systems can be joined in a low- and middle-income setting, which is why it belongs on this page. It is not used in the calibration, and the direction of the published integration matters: it substantially uses vaccination contacts to prompt birth registration, rather than using registration records to find unvaccinated children. Reading it the other way round would overstate what has been demonstrated.`,unresolvedGap:`No published estimate of a causal vaccination gain attributable to the linkage. Establishing one would need individual-level records from both systems for the same children.`,metrics:{integrationExists:{value:1,unit:`national integration in operation`,year:2023,evidenceClass:`A`,sourceIds:[`S10`],observed:!0,label:`BRIS to EPI integration`},causalVaccinationGain:{value:null,unit:`additional children vaccinated`,evidenceClass:`E`,sourceIds:[],observed:!1,label:`Causal vaccination gain from linkage`,caveat:`Not available. The integration is documented; its causal effect on coverage is not.`}}}],pension:[{id:`karnataka`,country:`Karnataka, India`,branch:`death-pension`,role:`observed`,grade:`Observed government programme result`,readiness:`ready`,narrative:`Karnataka linked its e-JanMa death registration system to social security pension administration. The state reports 132,000 deceased beneficiaries removed or suspended from the rolls and an annual saving of Rs 158.40 crore. Dividing one by the other gives about Rs 12,000 per affected beneficiary per year, which is consistent with the size of the state's social pensions. This is unusually clean evidence: a named system, a counted number of records acted on, and a reported financial consequence, all from the administration that operates the payroll.`,metrics:{beneficiariesRemoved:{value:132e3,unit:`deceased beneficiaries removed or suspended`,year:2024,evidenceClass:`A`,sourceIds:[`S11`],observed:!0,label:`Beneficiaries removed or suspended`},annualSavingInr:{value:1584e6,unit:`INR per year`,year:2024,evidenceClass:`A`,sourceIds:[`S11`],observed:!0,label:`Reported annual saving`,caveat:`Rs 158.40 crore, as reported by the state.`},savingPerBeneficiaryInr:{value:null,unit:`INR per beneficiary per year`,year:2024,evidenceClass:`C`,sourceIds:[`S11`],observed:!1,label:`Saving per affected beneficiary`,derivation:`Rs 1,584,000,000 / 132,000 beneficiaries = Rs 12,000 per beneficiary per year.`,caveat:`Derived by division from the two reported figures. Computed at runtime.`}}},{id:`brazil`,country:`Brazil`,branch:`death-pension`,role:`core`,grade:`Audited evidence, used for calibration`,readiness:`ready`,isCalibrationCase:!0,narrative:`The 2025 TCU audit of the Sirc civil registration information system found 13.1 million death records absent from the system and identified R$4.4bn of improper payments, of which up to R$2.7bn is tied specifically to missing death information. Those are accumulated stock figures. The model deliberately calibrates on the smaller, current flow instead: R$21,253,072.12 per month in the pension and social-security programmes, which annualises and converts to about US$0.22 per person per year. Using the stock figure would have produced a much larger number and a much weaker argument, because a backlog can only be cleared once.`,metrics:{deathRecordsMissing:{value:131e5,unit:`death records absent from Sirc`,year:2025,evidenceClass:`A`,sourceIds:[`S12`],observed:!0,label:`Death records absent from Sirc`},improperPaymentsTotalBrl:{value:44e8,unit:`BRL, accumulated stock`,year:2025,evidenceClass:`A`,sourceIds:[`S12`],observed:!0,label:`Improper payments identified overall`,caveat:`Accumulated stock. Not annualised anywhere in this model.`},deathLinkedPaymentsBrl:{value:27e8,unit:`BRL, accumulated stock`,year:2025,evidenceClass:`A`,sou 021 round cost about EUR 270,000 in census-specific terms. The caveat matters as much as the figure: the registers were built for broader administrative purposes, so a census-specific comparison does not capture the total historical cost of the infrastructure.`,metrics:{estimatedSavingsEur:{value:1e7,unit:`EUR`,year:2021,evidenceClass:`A`,sourceIds:[`S19`],observed:!0,label:`Estimated savings vs classical census`},relativeCostShare:{value:.1,unit:`share of traditional fieldwork cost`,year:2021,evidenceClass:`A`,sourceIds:[`S19`],observed:!0,label:`Register census relative cost`},cost2021Eur:{value:27e4,unit:`EUR, census-specific`,year:2021,evidenceClass:`A`,sourceIds:[`S19`],observed:!0,label:`2021 census-specific cost`}}},{id:`indonesia`,country:`Indonesia`,branch:`census`,role:`transition`,grade:`Technical transition case, monetization pending`,readiness:`not-ready`,narrative:`The 2020 census was the first in Indonesia to use Dukcapil population-administration data as the base for a combined approach. It matters because Indonesia is large, geographically complex and middle-income, which makes it a far better guide to what the transition looks like outside Europe than Slovenia or Turkiye. What it cannot yet do is carry a monetary figure. No comparable authoritative census-cost series has been identified, so none is shown.`,unresolvedGap:`Comparable authoritative census-cost series not yet closed. No national realised saving is claimed.`,metrics:{usedAdministrativeBase:{value:1,unit:`combined census using population administration data`,year:2020,evidenceClass:`A`,sourceIds:[`S20`],observed:!0,label:`Dukcapil data used as census base`},realisedSavingUsd:{value:null,unit:`USD`,evidenceClass:`E`,sourceIds:[],observed:!1,label:`Realised census saving`,caveat:`Not available. No comparable authoritative cost series has been identified, so no figure is shown.`}}},{id:`thailand`,country:`Thailand`,branch:`census`,role:`supporting`,grade:`Pilot case`,readiness:`supporting`,
