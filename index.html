3m. Table 4: US$3,482m of country-level cost across 73 countries. The stated equivalence of US$2,281m of development cost to US$0.90 per capita, which implies a covered population of 2,534,444,444.`,url:`https://documents1.worldbank.org/curated/en/457271468148160984/pdf/883510WP0CRVS000Box385194B00PUBLIC0.pdf`,caveat:`A 2014 plan for 73 countries, excluding India and China. It is a planning estimate, not observed expenditure, and it is the largest single replaceable input in this model. International support and monitoring costs of US$342m are reported separately and are not charged here.`},{id:`S02`,branch:`model`,organization:`U.S. Bureau of Labor Statistics`,title:`Consumer Price Index for All Urban Consumers (CPI-U), annual averages`,year:`2014, 2018, 2021`,supports:`Index values of 236.736 (2014), 251.107 (2018) and 270.970 (2021), used to restate costs and benefits in 2021 US dollars.`,url:`https://www.bls.gov/cpi/`},{id:`S03`,branch:`immunization`,organization:`Departamento Administrativo Nacional de Estadística (DANE), Colombia`,title:`Estadísticas Vitales: nacimientos 2024, and national population projections`,year:2024,supports:`445,011 live births in 2024, the lowest since the series began, and a national population of 53,425,635.`,url:`https://www.dane.gov.co/index.php/estadisticas-por-tema/salud/nacimientos-y-defunciones`,caveat:`The 2024 figure is preliminary (2024pr) in DANE's own labelling.`},{id:`S04`,branch:`immunization`,organization:`WHO and UNICEF`,title:`WUENIC estimates of national immunization coverage (DTP3)`,year:2024,supports:`DTP3 coverage of 89% (Colombia), 91% (Brazil) and 99% (Costa Rica).`,url:`https://www.who.int/teams/immunization-vaccines-and-biologicals/immunization-analysis-and-insights/global-monitoring/immunization-coverage/who-unicef-estimates-of-national-immunization-coverage`},{id:`S05`,branch:`immunization`,organization:`UNICEF`,title:`Birth registration data warehouse, country profiles`,year:2024,supports:`Working birth-registration coverage of 97% (Colombia) and 96% (Costa Rica).`,url:`https://data.unicef.org/topic/child-protection/birth-registration/`,caveat:`The Costa Rica value is conservative. Registration completeness there is generally reported at or above 99%, which would shrink the findable share further.`},{id:`S06`,branch:`immunization`,organization:`Instituto Brasileiro de Geografia e Estatística (IBGE), Registro Civil`,title:`Estatísticas do Registro Civil, and birth registration completeness estimates`,year:2023,supports:`2,376,901 registered live births in Brazil and registration completeness of 99.05%, from which the birth cohort is derived.`,url:`https://www.ibge.gov.br/estatisticas/sociais/populacao/9110-estatisticas-do-registro-civil.html`},{id:`S07`,branch:`immunization`,organization:`Instituto Nacional de Estadística y Censos (INEC), Costa Rica`,title:`Estadísticas Vitales: nacimientos, and the 2022 census`,year:2023,supports:`45,821 registered live births and a population of 5,044,197.`,url:`https://inec.cr/estadisticas-fuentes/estadisticas-demograficas`,caveat:`The population is the 2022 census count while the births are 2023, so the per-capita figure mixes two reference years.`},{id:`S08`,branch:`immunization`,organization:`Sim, Watts, Constenla, Brenzel and Patenaude, Health Affairs`,title:`Return On Investment From Immunization Against 10 Pathogens In 94 Low- And Middle-Income Countries, 2011-30`,year:2020,supports:`For 2021-30: a cost-of-illness return of 19.8 to 1, and immunization programme costs of US$41.2 per surviving infant. Both are in 2018 US dollars. The paper also reports 26.1 and US$24.6 for 2011-20, and value-of-statistical-life returns of 51.0 and 52.2; the conservative cost-of-illness basis is used here.`,url:`https://www.healthaffairs.org/doi/10.1377/hlthaff.2020.00103`,caveat:`Reported for 94 low- and middle-income countries as a group, not country by country. Applied here as a transferred parameter. Taking the cost and the return from the same paper and the same decade is what keeps the per-child figure internally consistent.`},{id:`S10`,branch:`immunization`,organization:`Government of Bangladesh, Office of the Registrar General (BRIS) and Directorate General of Health Services`,title:`Integration of the Birth Registration Information System with the national immunization (EPI) database`,year:2023,supports:`That an operational birth-registration to immunization integration exists at national scale.`,url:`https://everychildalive.org/`,caveat:`The integration operates substantially in the direction immunization to registration, using vaccination contacts to prompt registration. It does not establish that registration raised immunization coverage.`},{id:`S11`,branch:`death-pension`,organization:`Government of Karnataka, Revenue Department (reported by Press Trust of India)`,title:`Karnataka identifies 3.58 lakh bogus pension beneficiaries, saves Rs 430 cr`,year:2022,supports:`Revenue Minister R. Ashoka, 30 April 2022: 3.58 lakh ineligible and bogus pension beneficiaries identified and Rs 430 crore saved, using beneficiary data linked to the ration database and to e-JanMa, the state births and deaths register. Also 73.23 lakh total beneficiaries and Rs 7,800 crore of pension spending in 2020-21.`,url:`https://www.business-standard.com/article/current-affairs/karnataka-identifies-3-58-lakh-bogus-pension-beneficiaries-saves-rs-430-cr-122043000929_1.html`,caveat:`A minister's statement, not an audited figure. "Ineligible and bogus" includes deceased beneficiaries but is not limited to them, and the state did not publish the split.`},{id:`S24`,branch:`death-pension`,organization:`Directorate of Social Security and Pensions, Karnataka (reported by Deccan Herald)`,title:`Karnataka govt weeds out 5 lakh dead pensioners, saves Rs 600 crore`,year:2021,supports:`Director G. Prabhu, 30 May 2021: about 5 lakh deceased beneficiaries removed over one year and about Rs 600 crore saved, against 66.4 lakh pensioners and a directorate budget of Rs 8,200 crore. Pensions run from Rs 600 to Rs 4,000 a month.`,url:`https://www.deccanherald.com/state/karnataka-govt-weeds-out-5-lakh-dead-pensioners-saves-rs-600-crore-991877.html`,caveat:`The directorate attributes this exercise to Aadhaar-linked accounts and doorstep verification rather than to the register linkage. It is used here as an independent check on the saving per beneficiary, not as evidence for the linkage itself.`},{id:`S12`,branch:`death-pension`,organization:`Tribunal de Contas da União (TCU), Brazil`,title:`Audit of the Sistema Nacional de Informações de Registro Civil (Sirc) and benefit payments to deceased persons`,year:2025,supports:`13.1 million deaths not registered in Sirc; R$4.4bn paid to 275,800 already-deceased people between 2016 and February 2025; R$2.7bn attributed to death records reaching Sirc late; and R$28.5 million still paid each month in the latest period examined, across social assistance, social security and public payroll.`,url:`https://portal.tcu.gov.br/imprensa/noticias/falhas-na-base-de-dados-de-pessoas-falecidas-geram-r-4-bi-em-pagamentos-indevidos`,caveat:`The R$4.4bn and R$2.7bn are accumulated over nine years and are stock, not flow. Only the monthly figure is annualised here, and annualising one month assumes that month is representative.`},{id:`S14`,branch:`death-pension`,organization:`Instituto Brasileiro de Geografia e Estatística (IBGE)`,title:`Censo Demográfico 2022 and subsequent population estimates`,year:2024,supports:`A Brazilian population of 212,812,405, used as the per-capita denominator.`,url:`https://www.ibge.gov.br/estatisticas/sociais/populacao.html`},{id:`S15`,branch:`model`,organization:`exchangerate-api.com`,title:`Market mid-rates against the US dollar`,year:`6 August 2026`,supports:`The single set of rates used to convert every local-currency figure on this site: ₹95.17, R$5.12, R16.32 and €0.87 per US dollar.`,url:`https://www.exchangerate-api.com/`,caveat:`One rate and one date for the whole site. Figures governments reported in earlier years are converted at a current rate, which mixes a historic quantity with a present rate.`},{id:`S16`,branch:`death-pension`,organization:`Auditor-General of South Africa and the South African Social Security Agency (SASSA)`,title:`Audit of social grant payments and life-status verification against the Department of Home Affairs`,year:2024,supports:`About R15 million paid to deceased beneficiaries, and 5,924 beneficiaries paid more than 45 days after death.`,url:`https://www.agsa.co.za/`,caveat:`Residual leakage in a system that already matches routinely against the population register. Used for triangulation, not in the headline calculation.`},{id:`S17`,branch:`census`,organization:`United Nations Economic Commission for Europe (UNECE)`,title:`Why is it more and more difficult to finance a census? Conference of European Statisticians census meeting`,year:2013,supports:`Census costs of US$2 to US$6 per capita in countries with GDP per capita below US$20,000, above US$10 per capita in countries above US$30,000, and an average traditional census cost of about US$8 per capita of which more than US$5 is collection.`,url:`https://unece.org/fileadmin/DAM/stats/documents/ece/ces/ge.41/2013/census_meeting/Day2_0935_financing_census__oral_presentation.doc`,caveat:`A cost band across countries, not a median for any one group. The model takes the US$4.00 midpoint of the band that matches its denominator countries and carries the full band as a sensitivity.`},{id:`S18`,branch:`census`,organization:`Beşe Canpolat and Gürleyen Gök, Statistical Journal of the IAOS`,title:`Census methodology in Turkey: transformation from traditional to register-based administrative data`,year:2020,supports:`A 2000 traditional census costing US$48.3 million, a 2011 combined census costing US$13.9 million, and a fall in cost per capita from US$0.71 to US$0.19 across those two rounds.`,url:`https://journals.sagepub.com/doi/10.3233/SJI-190561`,caveat:`Türkiye's traditional census was unusually cheap per person by international standards, so its saving understates what a high-cost field census would save.`},{id:`S19`,branch:`census`,organization:`Statistical Office of the Republic of Slovenia (SURS)`,title:`Register-based census programme`,year:2011,supports:`That the 2011 register census cost about 10% of the 2002 field census, a saving of at least EUR 10 million.`,url:`https://www.stat.si/popis2011/eng/Default.aspx?lang=eng`,caveat:`The registers were built for broader administrative purposes, so a census-specific comparison does not capture the total historical cost of the infrastructure.`},{id:`S20`,branch:`census`,organization:`Badan Pusat Statistik (BPS) and Dukcapil, Indonesia`,title:`Sensus Penduduk 2020: combined census using population administration data`,year:2020,supports:`That Indonesia's 2020 census was the first to use Dukcapil population-administration data as its base.`,url:`https://sensus.bps.go.id/`,caveat:`No comparable census-cost series has been identified. No saving is claimed for Indonesia.`}]},Xn=Yn.sources,Zn=new Map(Xn.map(e=>[e.id,e]));function Qn(e){return Zn.get(e)}function $n(e=[]){return e.map(e=>Qn(e)||{id:e,branch:`model`,organization:`Source not found`,title:`"${e}" is referenced here but is not in the source register`,year:``,supports:`Nothing. This is a referencing error and should be reported.`})}Yn._provenance;var er=o((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),A=o(((e,t)=>{t.exports=er()}))();function tr({cls:e,showLabel:t=!0}){return(0,A.jsx)(`span`,{className:`ev ${e.toLowerCase()}`,title:`Class ${e} — ${Un[e]}. ${Wn[e]}`,children:t?Un[e]:null})}var nr=(0,x.createContext
